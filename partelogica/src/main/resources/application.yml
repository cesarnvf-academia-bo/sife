spring:
  application:
    name: sife
  datasource:
    url: ${BD_URL:jdbc:postgresql://localhost:5432/sife}
    username: ${BD_USUARIO:postgres}
    password: ${BD_CLAVE:}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: bo.org.citior.sife.dominio
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

siat:
  codigos-url: https://pilotosiatservicios.impuestos.gob.bo/v2/FacturacionCodigos
  sincronizacion-url: https://pilotosiatservicios.impuestos.gob.bo/v2/FacturacionSincronizacion
  operaciones-url: https://pilotosiatservicios.impuestos.gob.bo/v2/FacturacionOperaciones
  compraventa-url: https://pilotosiatservicios.impuestos.gob.bo/v2/ServicioFacturacionCompraVenta
  tiempo-conexion-ms: 5000
  tiempo-respuesta-ms: 15000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
